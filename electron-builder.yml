appId: app.sortbox.desktop
productName: Sortbox
npmRebuild: true
directories:
  output: dist
files:
  - out
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/*.node"
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 分拣匣 Sortbox
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
