appId: app.sortbox.desktop
productName: Sortbox
npmRebuild: false
directories:
  output: dist
files:
  - out
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/*.node"
win:
  target:
    - nsis
  # 当前环境不能创建符号链接，签名工具解压会失败。不签名仍可生成安装包。
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 分拣匣 Sortbox
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
